version: 1
regressions:
  - id: MODEL-MUST-DRIVE
    symptom: A mode proceeds without a real model or follows a static cleanup discovery route.
    observable_signal: tests/test_model_first.py
  - id: EXECUTION-IS-NOT-CLASSIFICATION
    symptom: Execution mechanics rewrite a model judgment, or a model proposal bypasses identity verification or human confirmation.
    observable_signal: tests/test_contracts.py and tests/test_filesystem.py
  - id: NO-UNASSESSED-REMOVAL
    symptom: A file with no model assessment is staged in Trash.
    observable_signal: tests/test_model_authority.py
  - id: PRESERVE-RAW-MODEL-JUDGMENT
    symptom: Withheld permissions rewrite or conceal a wrong model answer in the audit.
    observable_signal: tests/test_model_owned_judgment.py
  - id: PATH-FREE-LEARNED-OBSERVATIONS
    symptom: Arbitrary folder/app labels enter learned cleanup inference or rename alters judgment without evidence changes.
    observable_signal: tests/test_decision_observation_contract.py and tests/test_learned_adapter_integrity.py
  - id: LEARNED-ARTIFACT-INTEGRITY
    symptom: Missing/tampered adapted Laya weights fall back to unsafe base inference.
    observable_signal: tests/test_learned_runtime_admission.py and tests/test_adapter_installer.py
  - id: OWNER-OPERATION-BOUNDARY
    symptom: Plan/model argv executes, native pruning is advertised as reversible, or stale owner path/activity is accepted.
    observable_signal: tests/test_owner_operation_execution.py and tests/test_owner_plan_confirmation.py
  - id: CURRENT-SCAN-IS-NOT-CONFLICT
    symptom: Process check ignores other owner tasks or mistakes own scanner ancestry for a cache job.
    observable_signal: tests/test_owner_activity_visibility.py
  - id: OWNER-FIRST-USEFULNESS
    symptom: Known owner-tool operations are delayed behind full opaque tree measurement.
    observable_signal: tests/test_owner_first_scan.py
  - id: NO-STALE-MODEL-EVIDENCE
    symptom: Changed activity/target facts are silently reused during selection reassessment.
    observable_signal: tests/test_reassessment_evidence.py
  - id: NO-SILENT-MODEL-TRUNCATION
    symptom: Expanded evidence is truncated without an explicit failure.
    observable_signal: tests/test_model_input_budget.py
  - id: VISIBLE-MODEL-ABSTENTION
    symptom: A review answer disappears from the JSON report or becomes selectable.
    observable_signal: tests/test_model_review_visibility.py
  - id: CHECKBOX-ONLY-CLEAN
    symptom: Non-actionable status rows or diagnostic banners clutter the Clean list, or hiding them changes removal authority.
    observable_signal: tests/test_checkbox_only_review.py
  - id: SIZE-RANKED-REVIEW
    symptom: Large model proposals are hidden behind traversal-order small files, or totals show selected bytes only.
    observable_signal: tests/test_useful_review_order.py
  - id: RESOURCE-CONTEXT-COLLISION
    symptom: Deep cache and project files lose their distinct enclosing directory context in model input.
    observable_signal: tests/test_deep_resource_context.py
  - id: RESOURCE-NOT-PER-FILE-INFERENCE
    symptom: Thousands of unselected descendants trigger thousands of model calls or manifest objects.
    observable_signal: tests/test_fast_resources.py and tests/test_resource_cost_contract.py
  - id: SEALED-RESOURCE-CONFIRMATION
    symptom: A directory is staged without a pre-confirmation manifest or after descendant metadata changes.
    observable_signal: tests/test_resource_confirmation.py and tests/test_resource_staging.py
  - id: NO-RESOURCE-RESTORE-OVERWRITE
    symptom: Directory restore overwrites a new destination or follows an internal symlink.
    observable_signal: tests/test_resource_safety.py
  - id: RESOURCE-TRANSACTION-CONFLICT
    symptom: A selected resource contains the executor's own journal or Trash.
    observable_signal: tests/test_resource_transaction_boundaries.py
  - id: RESOURCE-CANCELLED-PLAN
    symptom: Cancellation leaves actionable partial resource proposals.
    observable_signal: tests/test_resource_cancellation.py
  - id: LEARNING-SPLIT-INTEGRITY
    symptom: Semantic-family variants or identical evidence text leak across training and reported holdouts.
    observable_signal: tests/test_cleanup_learning_contract.py
  - id: RAW-MODEL-QUALITY-NOT-PERMISSION
    symptom: Model evaluation counts suppressed errors as correct or picks a checkpoint from final-test scores.
    observable_signal: tests/test_learning_deployment_selection.py
  - id: ACTUAL-FILES-NOT-COMMANDS
    symptom: Owner commands or whole command-store allocations appear as file findings/proposed bytes.
    observable_signal: tests/test_actual_file_checklist.py and tests/test_file_only_pipeline.py
  - id: CANONICAL-PURPOSE-EVIDENCE
    symptom: Cache purpose is lost or guessed from arbitrary substrings; sandbox state is conflated with cache resources.
    observable_signal: tests/test_file_namespace_observation.py and tests/test_sandbox_cache_observations.py
  - id: HELDOUT-NEGATIVES-NOT-DROPPED
    symptom: Corpus deduplication silently removes mixed/personal/sensitive controls from evaluation splits.
    observable_signal: tests/test_file_corpus_integrity.py
  - id: FILE-REVIEW-EVIDENCE-PARITY
    symptom: Selected review loses actual purpose facts or trusts forged namespace evidence.
    observable_signal: tests/test_file_review_evidence_parity.py
  - id: STATUS-TREEMAP-ACCOUNTING
    symptom: Estimated paths fill recorded category areas, nested sizes double count, or stale parent allocations persist after drilldown.
    observable_signal: tests/test_status_map_contract.py and tests/test_status_stale_expansion.py and tests/test_status_nested_canvas.py
  - id: STATUS-RECOMMENDATION-SELECTION
    symptom: Status loses Laya recommendations, selects command/container/review targets, or selection deletes without final consent.
    observable_signal: tests/test_status_recommendations.py and tests/test_status_treemap_ui.py and tests/test_status_selection_refresh.py
  - id: CATEGORY-MIXING
    symptom: An exact System Data breakdown is invented by combining unrelated timestamps or paths.
    observable_signal: tests/test_contracts.py
  - id: PLAN-EXPORT-LIVE-CACHE-RACE
    symptom: clean --output exits with "Target identity changed since review" and no report or plan because one approved cache changed during the scan.
    observable_signal: tests/test_resource_safety.py::test_plan_export_survives_a_resource_changing_after_the_scan
  - id: ADAPTER-PROVISIONING-INTEGRITY
    symptom: The learned adapter is missing on a fresh install, or unverified, tampered or symlinked bytes reach the model path.
    observable_signal: tests/test_adapter_provisioning.py and tests/test_learned_adapter_integrity.py
