<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">jev-clean by Nexora — see what macOS System Data really is, clear it safely, with undo</title>
  <desc id="desc">The gray System Data bar becomes named parts, each judged remove, review or keep by a local model. Measured results: zero wrong removals in 337 frozen test cases, 2.3 GB peak memory scanning all of ~/Library, every file move can be undone from the Trash, and no data leaves the Mac.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#101820"/>

  <!-- Brand and promise -->
  <rect x="56" y="49" width="8" height="22" rx="2" fill="#6ce5ca"/>
  <text x="78" y="67" class="mono" fill="#b7cbd2" font-size="18" letter-spacing="5">NEXORA</text>
  <text x="54" y="156" class="mono" fill="#e1e9ec" font-size="72" font-weight="bold" letter-spacing="-4">jev-clean</text>
  <text x="58" y="208" class="sans" fill="#6ce5ca" font-size="29" font-weight="600">See what System Data really is.</text>
  <text x="58" y="246" class="sans" fill="#e1e9ec" font-size="25">Clear it safely, with undo.</text>

  <!-- Effect: the gray bar becomes named, judged parts (illustration) -->
  <g class="sans">
    <rect x="636" y="44" width="516" height="228" rx="14" fill="#172832" stroke="#2c4a50"/>
    <text x="660" y="78" class="mono" fill="#92aab4" font-size="13" letter-spacing="2">BEFORE · macOS STORAGE</text>
    <rect x="660" y="90" width="468" height="36" rx="6" fill="#4a5a62"/>
    <text x="894" y="114" fill="#d5dee2" font-size="16" text-anchor="middle">System Data  ?  ?  ?</text>
    <text x="660" y="160" class="mono" fill="#6ce5ca" font-size="13" letter-spacing="2">AFTER · jev-clean</text>
    <rect x="660" y="172" width="150" height="36" rx="6" fill="#6ce5ca"/>
    <text x="735" y="195" fill="#0d1a1f" font-size="14" font-weight="600" text-anchor="middle">Caches</text>
    <rect x="813" y="172" width="112" height="36" fill="#55c4ac"/>
    <text x="869" y="195" fill="#0d1a1f" font-size="14" font-weight="600" text-anchor="middle">Build data</text>
    <rect x="928" y="172" width="70" height="36" fill="#e6b45a"/>
    <text x="963" y="195" fill="#1f1606" font-size="14" font-weight="600" text-anchor="middle">Logs</text>
    <rect x="1001" y="172" width="80" height="36" fill="#7f9ab0"/>
    <text x="1041" y="195" fill="#0d1a1f" font-size="14" font-weight="600" text-anchor="middle">Backups</text>
    <rect x="1084" y="172" width="44" height="36" rx="6" fill="#e6b45a"/>
    <text x="1106" y="195" fill="#1f1606" font-size="14" font-weight="600" text-anchor="middle">?</text>
    <rect x="660" y="230" width="12" height="12" rx="2" fill="#6ce5ca"/>
    <text x="680" y="241" fill="#b7cbd2" font-size="14">remove</text>
    <rect x="744" y="230" width="12" height="12" rx="2" fill="#e6b45a"/>
    <text x="764" y="241" fill="#b7cbd2" font-size="14">review</text>
    <rect x="826" y="230" width="12" height="12" rx="2" fill="#7f9ab0"/>
    <text x="846" y="241" fill="#b7cbd2" font-size="14">keep</text>
    <text x="1128" y="241" fill="#6f8892" font-size="12" text-anchor="end">illustration</text>
  </g>

  <!-- Measured strengths -->
  <g class="sans">
    <rect x="56" y="304" width="258" height="196" rx="14" fill="#172832" stroke="#37675f"/>
    <text x="80" y="370" fill="#6ce5ca" font-size="54" font-weight="700">0</text>
    <text x="80" y="402" fill="#e1e9ec" font-size="19" font-weight="600">wrong removals</text>
    <text x="80" y="430" fill="#b7cbd2" font-size="15">in 337 frozen test cases</text>
    <text x="80" y="472" fill="#6f8892" font-size="12">authored tests, not a guarantee</text>

    <rect x="330" y="304" width="258" height="196" rx="14" fill="#172832" stroke="#37675f"/>
    <text x="354" y="370" fill="#6ce5ca" font-size="54" font-weight="700">2.3 GB</text>
    <text x="354" y="402" fill="#e1e9ec" font-size="19" font-weight="600">peak memory</text>
    <text x="354" y="430" fill="#b7cbd2" font-size="15">scanning all of ~/Library</text>
    <text x="354" y="472" fill="#6f8892" font-size="12">stays flat, yields to memory pressure</text>

    <rect x="604" y="304" width="258" height="196" rx="14" fill="#172832" stroke="#37675f"/>
    <text x="628" y="370" fill="#6ce5ca" font-size="54" font-weight="700">Undo</text>
    <text x="628" y="402" fill="#e1e9ec" font-size="19" font-weight="600">every file move</text>
    <text x="628" y="430" fill="#b7cbd2" font-size="15">Trash + restore journal</text>
    <text x="628" y="472" fill="#6f8892" font-size="12">Trash is never emptied for you</text>

    <rect x="878" y="304" width="266" height="196" rx="14" fill="#172832" stroke="#37675f"/>
    <text x="902" y="370" fill="#6ce5ca" font-size="54" font-weight="700">0 bytes</text>
    <text x="902" y="402" fill="#e1e9ec" font-size="19" font-weight="600">leave your Mac</text>
    <text x="902" y="430" fill="#b7cbd2" font-size="15">the model runs locally</text>
    <text x="902" y="472" fill="#6f8892" font-size="12">no account, no API key, no cloud</text>
  </g>

  <text x="58" y="552" class="mono" fill="#92aab4" font-size="14">You approve every path · macOS · Apple Silicon · local Laya-MLX model · free, Apache-2.0</text>
</svg>
