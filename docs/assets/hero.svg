<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">jev-clean by Nexora — Clean mysterious macOS System Data</title><desc id="desc">Model-led System Data cleanup, human control. The mandatory local model is provisioned and verified during installation.</desc><rect width="1200" height="440" rx="24" fill="#101820"/><path d="M820 0V440M860 0V440M900 0V440M940 0V440M980 0V440M1020 0V440M1060 0V440M1100 0V440M1140 0V440M1180 0V440M800 40H1200M800 80H1200M800 120H1200M800 160H1200M800 200H1200M800 240H1200M800 280H1200M800 320H1200M800 360H1200M800 400H1200" stroke="#20323b"/><rect x="56" y="49" width="8" height="22" rx="2" fill="#6ce5ca"/><text x="78" y="67" fill="#b7cbd2" font-family="monospace" font-size="18" letter-spacing="5">NEXORA</text><text x="56" y="176" fill="#e1e9ec" font-family="monospace" font-size="78" font-weight="bold" letter-spacing="-5">jev-clean</text><text x="60" y="234" fill="#6ce5ca" font-family="sans-serif" font-size="30">Clean mysterious macOS System Data.</text><text x="60" y="274" fill="#e1e9ec" font-family="sans-serif" font-size="24">The model investigates. You choose what goes.</text><rect x="60" y="319" width="165" height="49" rx="7" fill="#203c42"/><text x="81" y="350" fill="#6ce5ca" font-family="monospace" font-size="20">01 / CLEAN</text><rect x="244" y="319" width="180" height="49" rx="7" fill="#203c42"/><text x="264" y="350" fill="#6ce5ca" font-family="monospace" font-size="20">02 / STATUS</text><g font-family="monospace" font-size="16"><rect x="795" y="116" width="355" height="226" rx="12" fill="#172832" stroke="#37675f"/><circle cx="815" cy="141" r="4" fill="#6ce5ca"/><text x="831" y="147" fill="#6ce5ca">SYSTEM DATA → CLEANUP</text><text x="815" y="189" fill="#e1e9ec">ACCOUNT → MODEL INVESTIGATION</text><text x="815" y="223" fill="#e1e9ec">MODEL → REVIEW → YOUR CHOICE</text><text x="815" y="266" fill="#b7cbd2">Model included in setup.</text><text x="815" y="302" fill="#b7cbd2">Ready means inference verified.</text></g><text x="61" y="411" fill="#92aab4" font-family="monospace" font-size="14">macOS · Apple Silicon · Mandatory local Laya-MLX · Open source</text></svg>
