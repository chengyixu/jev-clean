name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.27'
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check src tests scripts install.py
      - run: uv run ruff format --check src tests scripts install.py
      - run: uv run mypy src
      - run: uv run pytest --cov=jev_clean --cov-report=term-missing --cov-fail-under=75
      - run: uv run bash scripts/repo-guards.sh
      - run: uv build
  ci-success:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.check.result }}' = success
